name: Deploy Movira Help Center to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: movira-help-center-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::072508717210:role/movira-help-center-github-deploy
  FRONTEND_BUCKET: movira-help-center-072508717210-prod
  CLOUDFRONT_DISTRIBUTION_ID: E48XR9YKCMSTD
  APP_URL: https://d2cmyb66uuvl5v.cloudfront.net

jobs:
  deploy:
    name: Build and deploy Movira Help Center
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "072508717210"
          role-session-name: movira-help-center-${{ github.run_id }}

      - name: Validate S3 bucket
        run: |
          aws s3api head-bucket \
            --bucket "${FRONTEND_BUCKET}"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp build provenance
        run: |
          printf '{"commit":"%s","runId":"%s","builtAt":"%s"}\n' \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > public/build-info.json

      - name: Build production help center
        run: npm run build

      - name: Deploy versioned assets
        run: |
          aws s3 sync out/_next/static/ "s3://${FRONTEND_BUCKET}/_next/static/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy public files
        run: |
          aws s3 sync out/ "s3://${FRONTEND_BUCKET}/" \
            --delete \
            --exclude "_next/static/*" \
            --exclude "*.html" \
            --exclude "*.txt" \
            --exclude "*.xml" \
            --cache-control "public,max-age=3600"

      - name: Deploy pages and metadata
        run: |
          aws s3 cp out/ "s3://${FRONTEND_BUCKET}/" \
            --recursive \
            --exclude "*" \
            --include "*.html" \
            --include "*.txt" \
            --include "*.xml" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          INVALIDATION_ID="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Verify production deployment
        run: |
          BUILD_INFO="$(curl --fail --silent --show-error \
            "${APP_URL}/build-info.json?run=${GITHUB_RUN_ID}")"
          test "$(printf '%s' "${BUILD_INFO}" | jq -r '.commit')" = "${GITHUB_SHA}"

          curl --fail --silent --show-error \
            "${APP_URL}/docs/create-a-booking/?run=${GITHUB_RUN_ID}" \
            > /dev/null
